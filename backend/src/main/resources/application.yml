spring:
  application:
    name: burgesta-api
  datasource:
    # Local development: a file-based H2 database, so admin changes survive restarts.
    url: jdbc:h2:file:./data/burgesta;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    username: sa
    password:
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    locations: classpath:db/migration

server:
  port: ${PORT:8080}
  error:
    include-stacktrace: never

burgesta:
  admin:
    username: ${ADMIN_USERNAME:admin}
    password: ${ADMIN_PASSWORD:burgesta-admin}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173,http://localhost:4173}

---
# Production (Railway). Railway's PostgreSQL plugin exposes PGHOST, PGPORT, PGDATABASE, PGUSER and PGPASSWORD;
# reference them from the backend service's variables, e.g. PGHOST=${{Postgres.PGHOST}}.
spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: jdbc:postgresql://${PGHOST}:${PGPORT:5432}/${PGDATABASE}
    username: ${PGUSER}
    password: ${PGPASSWORD}
    hikari:
      maximum-pool-size: 5
